name: release

# Publishes a new release whenever a tag matching the Semantic Versioning
# pattern is pushed (e.g. v0.0.1, v1.2.3, v1.0.0-beta.2, v2.0.0-rc.1).
#
# Behavior:
#   1. Build a standalone executable for each allow-listed target.
#   2. Bundle them (plus a source tarball) into per-target artifacts.
#   3. Generate SHA-256 checksums for every file.
#   4. Create (or replace) the GitHub Release for this tag and upload every
#      file to it. The installer script reads these exact filenames and
#      rejects anything else, so the allow-list is enforced on both ends.
#
# Required permissions (set in Settings → Actions → General):
#   - Contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: linux
            arch: x64
          - target: linux-arm64
            os: linux
            arch: arm64
          - target: darwin-x64
            os: darwin
            arch: x64
          - target: darwin-arm64
            os: darwin
            arch: arm64
          - target: windows-x64
            os: windows
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to a version whose cross-target tarballs are published on npm.
          # `latest` resolves to the latest Bun release, but cross-target
          # tarballs for the new version land on npm a few minutes after the
          # GitHub release, which can cause a race where the release tag
          # bundles but cross-compiles fail with "not available for download".
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone executable
        env:
          BUN_COMPILE_TARGETS: ${{ matrix.target }}
        run: |
          mkdir -p release
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            linux-x64)    bun build --compile --target=bun-linux-x64    --outfile=release/classroom    src/cli.ts ;;
            linux-arm64)  bun build --compile --target=bun-linux-arm64  --outfile=release/classroom    src/cli.ts ;;
            darwin-x64)   bun build --compile --target=bun-darwin-x64   --outfile=release/classroom    src/cli.ts ;;
            darwin-arm64) bun build --compile --target=bun-darwin-arm64 --outfile=release/classroom    src/cli.ts ;;
            windows-x64)  bun build --compile --target=bun-windows-x64  --outfile=release/classroom.exe src/cli.ts ;;
            *) echo "Unsupported target ${{ matrix.target }}" >&2; exit 1 ;;
          esac

      - name: Bundle archive + checksum
        working-directory: release
        run: |
          set -euo pipefail
          mkdir -p staging
          # Move the executable into staging under its canonical name.
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            mv classroom.exe staging/classroom.exe
          else
            mv classroom staging/classroom
          fi

          # The installer expects this exact layout under repo/:
          #   repo/dist/classroom[.exe]
          # plus the version marker at repo/.classroom-cli-version.
          mkdir -p archive
          cp -R staging/. archive/dist/
          cp "${{ github.workspace }}/.github/VERSION_TEMPLATE" archive/.classroom-cli-version 2>/dev/null || true
          echo "${{ github.ref_name }}" > archive/.classroom-cli-version

          # Build the artifact tarball.
          tar -czf "classroom-cli_${{ matrix.target }}.tar.gz" -C archive .

          # SHA-256 checksum sidecar.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "classroom-cli_${{ matrix.target }}.tar.gz" \
              | awk '{print $1"  "$2}' > "classroom-cli_${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "classroom-cli_${{ matrix.target }}.tar.gz" \
              | awk '{print $1"  "$2}' > "classroom-cli_${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classroom-cli-${{ matrix.target }}
          path: |
            release/classroom-cli_${{ matrix.target }}.tar.gz
            release/classroom-cli_${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  source-tarball:
    name: source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball
        run: |
          mkdir -p release
          # GitHub already provides the source as a zip on the release; we still
          # ship a deterministic tar.gz so the installer can fetch it from a
          # plain URL if desired. Excludes are limited to local-only files.
          tar --exclude='./release' \
              --exclude='./node_modules' \
              --exclude='./.git' \
              --exclude='./bun.lock' \
              -czf release/classroom-cli_source.tar.gz \
              -C "${{ github.workspace }}" .
          sha256sum release/classroom-cli_source.tar.gz \
            | awk '{print $1"  classroom-cli_source.tar.gz"}' \
            > release/classroom-cli_source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-cli-source
          path: |
            release/classroom-cli_source.tar.gz
            release/classroom-cli_source.tar.gz.sha256
          retention-days: 14

  publish:
    name: publish release
    needs: [build, source-tarball]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Validate target allow-list
        env:
          ALLOWED: linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/classroom-cli-*/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No per-target archives found." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            # Expect: classroom-cli_<target>.tar.gz
            target="${base#classroom-cli_}"
            target="${target%.tar.gz}"
            case " $ALLOWED " in
              *" $target "*) ;;
              *) echo "Refusing to publish: target '$target' is not in the allow-list ($ALLOWED)" >&2; exit 1 ;;
            esac
            [[ -f "${f}.sha256" ]] || { echo "Missing checksum sidecar for $f" >&2; exit 1; }
          done
          echo "✔ All artifacts validated"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            dist/classroom-cli-*/*.tar.gz
            dist/classroom-cli-*/*.tar.gz.sha256
            dist/classroom-cli-source/*.tar.gz
            dist/classroom-cli-source/*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish npm (@paoloose/google-classroom-cli)
    needs: [build, source-tarball]
    runs-on: ubuntu-latest
    # Skip npm publish for prereleases; the GitHub Release is enough for those.
    # Remove this `if` to publish every tag including betas/rcs.
    if: ${{ !contains(github.ref, '-') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build npm packages (meta + 5 platform)
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip the leading 'v' from the tag for the npm version.
          version="${REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: tag '$REF_NAME' is not semver" >&2
            exit 1
          fi

          # Layout we produce:
          #   npm-meta/                 ← the @paoloose/google-classroom-cli meta package
          #   npm-pkg-linux-x64/        ← @paoloose/google-classroom-cli-linux-x64
          #   npm-pkg-linux-arm64/      ← @paoloose/google-classroom-cli-linux-arm64
          #   npm-pkg-darwin-x64/       ← @paoloose/google-classroom-cli-darwin-x64
          #   npm-pkg-darwin-arm64/     ← @paoloose/google-classroom-cli-darwin-arm64
          #   npm-pkg-windows-x64/      ← @paoloose/google-classroom-cli-windows-x64
          #
          # The meta package declares each of those as `optionalDependencies`. npm
          # only installs the optional deps whose `os`/`cpu` (or whose name in
          # `optionalDependencies`) matches the user's platform — so users on Linux
          # x64 only download the linux-x64 binary (~40 MB), not all 5.

          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64)

          rm -rf npm-meta npm-pkg-*

          mkdir -p npm-meta/bin

          # The JS launcher is identical to before, except the binary path now
          # points at the platform-specific package via require.resolve, instead
          # of a bundled `bin/<target>/dist/classroom` path. require.resolve
          # works because `optionalDependencies` are real node_modules entries.
          cat >npm-meta/bin/classroom.js <<'JS'
          #!/usr/bin/env node
          // Platform-to-binary resolver for @paoloose/google-classroom-cli.
          // Requires the matching platform-specific package (installed as an
          // optionalDependency) and spawns its bundled binary.
          import { spawn } from "node:child_process";
          import { createRequire } from "node:module";
          import { existsSync } from "node:fs";

          const PLATFORM_MAP = {
            "linux-x64":    { platform: "linux",   arch: "x64",   pkg: "@paoloose/google-classroom-cli-linux-x64",    binary: "dist/classroom"    },
            "linux-arm64":  { platform: "linux",   arch: "arm64", pkg: "@paoloose/google-classroom-cli-linux-arm64",  binary: "dist/classroom"    },
            "darwin-x64":   { platform: "darwin",  arch: "x64",   pkg: "@paoloose/google-classroom-cli-darwin-x64",   binary: "dist/classroom"    },
            "darwin-arm64": { platform: "darwin",  arch: "arm64", pkg: "@paoloose/google-classroom-cli-darwin-arm64", binary: "dist/classroom"    },
            "windows-x64":  { platform: "win32",   arch: "x64",   pkg: "@paoloose/google-classroom-cli-windows-x64",  binary: "dist/classroom.exe"},
          };

          const target = (() => {
            for (const [name, info] of Object.entries(PLATFORM_MAP)) {
              if (info.platform === process.platform && info.arch === process.arch) return { name, ...info };
            }
            return null;
          })();

          if (!target) {
            process.stderr.write(
              `classroom: no prebuilt binary for ${process.platform}/${process.arch}\n` +
              `Supported: ${Object.keys(PLATFORM_MAP).join(", ")}\n` +
              `If you're on a new platform, please open an issue: ` +
              `https://github.com/paoloose/google-classroom-cli/issues\n`,
            );
            process.exit(1);
          }

          let binaryPath;
          try {
            const require = createRequire(import.meta.url);
            const pkgJsonPath = require.resolve(`${target.pkg}/package.json`);
            binaryPath = pkgJsonPath.replace(/package\.json$/, target.binary);
          } catch (e) {
            process.stderr.write(
              `classroom: failed to locate ${target.pkg} (${e.code || e.message}).\n` +
              `This usually means the platform-specific package was not installed.\n` +
              `Re-run: npm i -g @paoloose/google-classroom-cli\n`,
            );
            process.exit(1);
          }
          if (!existsSync(binaryPath)) {
            process.stderr.write(`classroom: expected binary missing: ${binaryPath}\n`);
            process.exit(1);
          }

          const child = spawn(binaryPath, process.argv.slice(2), {
            stdio: "inherit",
            env: process.env,
          });
          child.on("exit", (code, signal) => {
            if (signal) { process.kill(process.pid, signal); } else { process.exit(code ?? 1); }
          });
          child.on("error", (err) => {
            process.stderr.write(`classroom: failed to spawn ${binaryPath}: ${err.message}\n`);
            process.exit(1);
          });
          JS
          chmod +x npm-meta/bin/classroom.js

          # Pick any platform's version marker — they're all the same (set from the tag).
          # The .classroom-cli-version lives INSIDE the per-target tarball, not alongside
          # it. Extract it from one of the tarballs first.
          mkdir -p _peek
          tar -xzf "dist/classroom-cli-linux-x64/classroom-cli_linux-x64.tar.gz" -C _peek
          cp "_peek/.classroom-cli-version" "npm-meta/.classroom-cli-version"
          rm -rf _peek

          # Meta package's package.json with optionalDependencies for each platform.
          cat >npm-meta/package.json <<EOF
          {
            "name": "@paoloose/google-classroom-cli",
            "version": "${version}",
            "description": "Agent-first CLI for Google Classroom",
            "license": "ISC",
            "type": "module",
            "bin": {
              "classroom": "./bin/classroom.js"
            },
            "files": [
              "bin",
              ".classroom-cli-version"
            ],
            "engines": {
              "node": ">=18"
            },
            "optionalDependencies": {
              "@paoloose/google-classroom-cli-darwin-arm64": "${version}",
              "@paoloose/google-classroom-cli-darwin-x64":   "${version}",
              "@paoloose/google-classroom-cli-linux-arm64":  "${version}",
              "@paoloose/google-classroom-cli-linux-x64":    "${version}",
              "@paoloose/google-classroom-cli-windows-x64":  "${version}"
            },
            "publishConfig": {
              "provenance": true
            }
          }
          EOF

          if [[ -f README.md ]]; then
            cp README.md npm-meta/README.md
          fi

          # Build each platform-specific package. Each one contains just `dist/<binary>`
          # and a `.classroom-cli-version` marker, with a package.json that pins the
          # binary's exact location for the launcher to find via require.resolve.
          for t in "${targets[@]}"; do
            tarball="dist/classroom-cli-${t}/classroom-cli_${t}.tar.gz"
            if [[ ! -f "$tarball" ]]; then
              echo "Missing tarball for $t: $tarball" >&2
              exit 1
            fi
            dir="npm-pkg-${t}"
            mkdir -p "${dir}/dist"
            tar -xzf "$tarball" -C "${dir}"
            # Sanity: a binary should be at <dir>/dist/classroom[.exe]
            if [[ ! -f "${dir}/dist/classroom" && ! -f "${dir}/dist/classroom.exe" ]]; then
              echo "Tarball for $t missing binary" >&2
              exit 1
            fi
            cat >"${dir}/package.json" <<EOF
          {
            "name": "@paoloose/google-classroom-cli-${t}",
            "version": "${version}",
            "description": "Prebuilt binary for @paoloose/google-classroom-cli (${t})",
            "license": "ISC",
            "files": [
              "dist",
              ".classroom-cli-version"
            ],
            "publishConfig": {
              "provenance": true
            }
          }
          EOF
            echo "  ✔ staged ${dir}"
          done

          echo "=== Meta package ==="
          cd npm-meta && npm pack --dry-run 2>&1 | grep -E "notice [0-9]|total files|package size"
          cd ..
          echo ""
          echo "=== Platform packages ==="
          for t in "${targets[@]}"; do
            echo "--- $t ---"
            cd "npm-pkg-${t}"
            npm pack --dry-run 2>&1 | grep -E "notice [0-9]|total files|package size"
            cd ..
          done

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          set -euo pipefail
          # Publish the platform packages first, then the meta package. Order matters:
          # the meta package's optionalDependencies point at exact versions, so the
          # platform packages must already exist on the registry when npm installs
          # the meta package — but publishing order doesn't actually enforce that
          # (npm doesn't resolve optionalDependencies at publish time). We do it in
          # this order anyway for clarity.
          targets=(linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64)
          for t in "${targets[@]}"; do
            echo "==> publishing @paoloose/google-classroom-cli-${t}"
            cd "npm-pkg-${t}"
            npm publish --provenance --access public
            cd ..
          done
          echo "==> publishing @paoloose/google-classroom-cli (meta)"
          cd npm-meta
          npm publish --provenance --access public