name: release

# Publishes a new release whenever a tag matching the Semantic Versioning
# pattern is pushed (e.g. v0.0.1, v1.2.3, v1.0.0-beta.2, v2.0.0-rc.1).
#
# Behavior:
#   1. Build a standalone executable for each allow-listed target.
#   2. Bundle them (plus a source tarball) into per-target artifacts.
#   3. Generate SHA-256 checksums for every file.
#   4. Create (or replace) the GitHub Release for this tag and upload every
#      file to it. The installer script reads these exact filenames and
#      rejects anything else, so the allow-list is enforced on both ends.
#
# Required permissions (set in Settings → Actions → General):
#   - Contents: write

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: linux
            arch: x64
          - target: linux-arm64
            os: linux
            arch: arm64
          - target: darwin-x64
            os: darwin
            arch: x64
          - target: darwin-arm64
            os: darwin
            arch: arm64
          - target: windows-x64
            os: windows
            arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pin to a version whose cross-target tarballs are published on npm.
          # `latest` resolves to the latest Bun release, but cross-target
          # tarballs for the new version land on npm a few minutes after the
          # GitHub release, which can cause a race where the release tag
          # bundles but cross-compiles fail with "not available for download".
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone executable
        env:
          BUN_COMPILE_TARGETS: ${{ matrix.target }}
        run: |
          mkdir -p release
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            linux-x64)    bun build --compile --target=bun-linux-x64    --outfile=release/classroom    src/cli.ts ;;
            linux-arm64)  bun build --compile --target=bun-linux-arm64  --outfile=release/classroom    src/cli.ts ;;
            darwin-x64)   bun build --compile --target=bun-darwin-x64   --outfile=release/classroom    src/cli.ts ;;
            darwin-arm64) bun build --compile --target=bun-darwin-arm64 --outfile=release/classroom    src/cli.ts ;;
            windows-x64)  bun build --compile --target=bun-windows-x64  --outfile=release/classroom.exe src/cli.ts ;;
            *) echo "Unsupported target ${{ matrix.target }}" >&2; exit 1 ;;
          esac

      - name: Bundle archive + checksum
        working-directory: release
        run: |
          set -euo pipefail
          mkdir -p staging
          # Move the executable into staging under its canonical name.
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            mv classroom.exe staging/classroom.exe
          else
            mv classroom staging/classroom
          fi

          # The installer expects this exact layout under repo/:
          #   repo/dist/classroom[.exe]
          # plus the version marker at repo/.classroom-cli-version.
          mkdir -p archive
          cp -R staging/. archive/dist/
          cp "${{ github.workspace }}/.github/VERSION_TEMPLATE" archive/.classroom-cli-version 2>/dev/null || true
          echo "${{ github.ref_name }}" > archive/.classroom-cli-version

          # Build the artifact tarball.
          tar -czf "classroom-cli_${{ matrix.target }}.tar.gz" -C archive .

          # SHA-256 checksum sidecar.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "classroom-cli_${{ matrix.target }}.tar.gz" \
              | awk '{print $1"  "$2}' > "classroom-cli_${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "classroom-cli_${{ matrix.target }}.tar.gz" \
              | awk '{print $1"  "$2}' > "classroom-cli_${{ matrix.target }}.tar.gz.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: classroom-cli-${{ matrix.target }}
          path: |
            release/classroom-cli_${{ matrix.target }}.tar.gz
            release/classroom-cli_${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  source-tarball:
    name: source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source tarball
        run: |
          mkdir -p release
          # GitHub already provides the source as a zip on the release; we still
          # ship a deterministic tar.gz so the installer can fetch it from a
          # plain URL if desired. Excludes are limited to local-only files.
          tar --exclude='./release' \
              --exclude='./node_modules' \
              --exclude='./.git' \
              --exclude='./bun.lock' \
              -czf release/classroom-cli_source.tar.gz \
              -C "${{ github.workspace }}" .
          sha256sum release/classroom-cli_source.tar.gz \
            | awk '{print $1"  classroom-cli_source.tar.gz"}' \
            > release/classroom-cli_source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-cli-source
          path: |
            release/classroom-cli_source.tar.gz
            release/classroom-cli_source.tar.gz.sha256
          retention-days: 14

  publish:
    name: publish release
    needs: [build, source-tarball]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Validate target allow-list
        env:
          ALLOWED: linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/classroom-cli-*/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No per-target archives found." >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            base="$(basename "$f")"
            # Expect: classroom-cli_<target>.tar.gz
            target="${base#classroom-cli_}"
            target="${target%.tar.gz}"
            case " $ALLOWED " in
              *" $target "*) ;;
              *) echo "Refusing to publish: target '$target' is not in the allow-list ($ALLOWED)" >&2; exit 1 ;;
            esac
            [[ -f "${f}.sha256" ]] || { echo "Missing checksum sidecar for $f" >&2; exit 1; }
          done
          echo "✔ All artifacts validated"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
          files: |
            dist/classroom-cli-*/*.tar.gz
            dist/classroom-cli-*/*.tar.gz.sha256
            dist/classroom-cli-source/*.tar.gz
            dist/classroom-cli-source/*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: publish npm (@paoloose/google-classroom-cli)
    needs: [build, source-tarball]
    runs-on: ubuntu-latest
    # Skip npm publish for prereleases; the GitHub Release is enough for those.
    # Remove this `if` to publish every tag including betas/rcs.
    if: ${{ !contains(github.ref, '-') }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build npm package
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Map the GitHub Actions runner to the target name used by the build matrix.
          # GitHub's runner arch strings are amd64/arm64; the build matrix uses x64/arm64.
          arch="$(uname -m)"
          case "$arch" in
            x86_64)  matrix_arch="x64" ;;
            aarch64) matrix_arch="arm64" ;;
            *) echo "Unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          target="linux-${matrix_arch}"
          tarball="dist/classroom-cli-${target}/classroom-cli_${target}.tar.gz"

          if [[ ! -f "$tarball" ]]; then
            echo "Expected tarball not found: $tarball" >&2
            ls -R dist || true
            exit 1
          fi

          rm -rf npm-pkg
          mkdir -p npm-pkg
          tar -xzf "$tarball" -C npm-pkg
          # The build step lays out `dist/classroom[.exe]` and `.classroom-cli-version`.
          ls -la npm-pkg/dist

          # Strip the leading `v` from the tag to get the package version.
          version="${REF_NAME#v}"
          # npm forbids leading zeros in numeric segments, but Git tag semver is fine.
          # Sanity-check the version shape.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: tag '$REF_NAME' is not semver" >&2
            exit 1
          fi

          cat >npm-pkg/package.json <<EOF
          {
            "name": "@paoloose/google-classroom-cli",
            "version": "${version}",
            "description": "Agent-first CLI for Google Classroom",
            "license": "ISC",
            "type": "module",
            "bin": {
              "classroom": "./dist/classroom"
            },
            "files": [
              "dist",
              ".classroom-cli-version"
            ],
            "engines": {
              "node": ">=18"
            },
            "publishConfig": {
              "provenance": true
            }
          }
          EOF

          # README for the npm registry listing (falls back to a stub if the repo
          # doesn't carry one at the package root).
          if [[ -f README.md ]]; then
            cp README.md npm-pkg/README.md
          fi

          cd npm-pkg
          # Sanity: the bin entry has to point at a file we ship.
          test -x dist/classroom || { echo "dist/classroom not executable" >&2; exit 1; }
          npm pack --dry-run
          echo "✔ npm package staged for $target as version $version"

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          set -euo pipefail
          # Trusted publishing via OIDC: npm picks up the workflow's id-token
          # (granted by `permissions: id-token: write` above) and verifies it
          # against the trusted-publisher config on the package page at
          # npmjs.com. No NPM_TOKEN secret is required.
          cd npm-pkg
          npm publish --provenance --access public
        # If npm Trusted Publishing isn't configured for this package yet,
        # temporarily uncomment the fallback below and set the NPM_TOKEN
        # repository secret. The OIDC path above is preferred.
        #
        #   run: NPM_CONFIG_TOKEN="$NPM_TOKEN" npm publish --provenance --access public
        #   env:
        #     NPM_TOKEN: ${{ secrets.NPM_TOKEN }}